name: Release

# Publishes the single-file MeetingScribe.exe as a GitHub Release.
#
#   git tag v1.0.0 && git push origin v1.0.0
#
# Or run manually from the Actions tab to produce a draft release for testing.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, without the leading v (e.g. 1.0.0)'
        required: true
        type: string
      draft:
        description: 'Create the release as a draft'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    # The app is Windows-only (WASAPI, WinForms, win-x64 single file), so this
    # cannot be cross-compiled on a Linux runner.
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve version
        id: version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
          TAG_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          $raw = if ($env:EVENT_NAME -eq 'workflow_dispatch') { $env:INPUT_VERSION } else { $env:TAG_NAME }
          $version = $raw.Trim().TrimStart('v')

          # A malformed version silently produces a mislabelled release, so fail loudly.
          if ($version -notmatch '^\d+\.\d+\.\d+(\.\d+)?$') {
            throw "Version '$version' is not in the form MAJOR.MINOR.PATCH."
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
          Write-Host "Building version $version"

      - name: Build single-file executable
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: .\build.ps1 -Version $env:VERSION

      - name: Verify the published executable
        id: verify
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $exe = 'publish\MeetingScribe.exe'

          # build.ps1 already smoke-tests the exe. This independently confirms the artifact
          # is a lone, correctly stamped binary before it reaches a public release page.
          $strays = @(Get-ChildItem publish -Recurse -File | Where-Object { $_.Name -ne 'MeetingScribe.exe' })
          if ($strays.Count -gt 0) {
            throw "Publish output is not a single file. Extra files: $($strays.Name -join ', ')"
          }

          $fileVersion = (Get-Item $exe).VersionInfo.FileVersion
          Write-Host "FileVersion: $fileVersion"
          if (-not $fileVersion.StartsWith($env:VERSION)) {
            throw "Executable reports version '$fileVersion' but the release is $env:VERSION."
          }

          $sizeMb = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          $sha = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()

          "sha256=$sha" >> $env:GITHUB_OUTPUT
          "sizeMb=$sizeMb" >> $env:GITHUB_OUTPUT

          Write-Host "SHA-256: $sha"
          Write-Host "Size:    $sizeMb MB"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MeetingScribe-${{ steps.version.outputs.version }}
          path: publish/MeetingScribe.exe
          if-no-files-found: error

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          IS_DRAFT: ${{ inputs.draft }}
          COMMIT_SHA: ${{ github.sha }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          SHA256: ${{ steps.verify.outputs.sha256 }}
          SIZE_MB: ${{ steps.verify.outputs.sizeMb }}
        run: |
          # The notes body lives in its own file: a PowerShell here-string cannot be
          # indented, which would break this YAML block scalar.
          $notes = (Get-Content '.github/release-notes-template.md' -Raw).
            Replace('{{VERSION}}', $env:VERSION).
            Replace('{{SIZE}}', $env:SIZE_MB).
            Replace('{{SHA}}', $env:SHA256)

          $notesFile = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          Set-Content -Path $notesFile -Value $notes -Encoding utf8

          $ghArgs = @(
            'release', 'create', $env:TAG,
            'publish/MeetingScribe.exe#MeetingScribe.exe (Windows x64)',
            '--title', "MeetingScribe $env:VERSION",
            '--notes-file', $notesFile
          )

          if ($env:EVENT_NAME -eq 'workflow_dispatch') {
            # Manual runs are for testing. Point the auto-created tag at the commit being
            # built, and clear any previous release for the same version so reruns work.
            gh release delete $env:TAG --yes --cleanup-tag 2>$null
            $ghArgs += @('--target', $env:COMMIT_SHA)
            if ($env:IS_DRAFT -ne 'false') { $ghArgs += '--draft' }
          }

          gh @ghArgs
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed with exit code $LASTEXITCODE" }

          Write-Host "Published $env:TAG"
